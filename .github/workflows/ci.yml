name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, Prisma and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cs_stonks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cs_stonks_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cs_stonks_shadow_test?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret
      SESSION_COOKIE_NAME: cs_stonks_session
      SESSION_MAX_AGE_DAYS: "30"
      STEAM_OPENID_PROVIDER_URL: https://steamcommunity.com/openid/login
      STEAM_WEB_API_BASE_URL: https://api.steampowered.com
      STEAM_WEB_API_KEY: ci-steam-web-api-key
      CATALOG_PROVIDER: bymykel
      PRICE_PROVIDER: json
      ENABLE_INTERNAL_CRON: "false"
      CSFLOAT_SYNC_ENABLED: "false"
      CSFLOAT_API_BASE_URL: https://csfloat.com/api/v1
      CSFLOAT_API_KEY: ci-csfloat-api-key
      NEXT_PUBLIC_USD_EUR_RATE: "0.92"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
